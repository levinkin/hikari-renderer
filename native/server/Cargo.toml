[package]
name = "hikari"
version = "0.5.0"
edition = "2021"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
jpeg-encoder = { version = "0.6", default-features = false, features = ["std"] }

[build-dependencies]
cc = "1"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
