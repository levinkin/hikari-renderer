name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            name: hikari-macos-aarch64
            extension: ''
            rustflags: ''
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            name: hikari-windows-x86_64
            extension: .exe
            rustflags: '-C target-feature=+crt-static'
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            name: hikari-linux-x86_64
            extension: ''
            rustflags: ''
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: hikari-linux-aarch64
            extension: ''
            rustflags: ''
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PACKAGE_NAME: ${{ matrix.name }}
      TARGET: ${{ matrix.target }}
      EXTENSION: ${{ matrix.extension }}
      RUSTFLAGS: ${{ matrix.rustflags }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - run: |
          rustup update stable --no-self-update
          rustup target add "$TARGET" --toolchain stable
          cargo +stable build --release --locked --manifest-path native/launcher/Cargo.toml --target "$TARGET"
      - shell: python
        run: |
          import os
          import pathlib
          import subprocess
          import zipfile

          name = os.environ['PACKAGE_NAME']
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          files = [pathlib.Path(path) for path in files if path and not path.startswith('.github/')]
          entries = set(files)
          for path in files:
              entries.update(parent for parent in path.parents if parent != pathlib.Path('.'))
          with zipfile.ZipFile(name + '.zip', 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              archive.writestr(name + '/', '')
              for path in sorted(entries, key=str):
                  archive.write(path, name + '/' + path.as_posix())
              binary = pathlib.Path('native/launcher/target') / os.environ['TARGET'] / 'release' / ('hikari' + os.environ['EXTENSION'])
              archive.write(binary, name + '/hikari' + os.environ['EXTENSION'])
      - run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --title "$RELEASE_TAG" --target "$(git rev-parse HEAD)" || gh release view "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" "$PACKAGE_NAME.zip" --clobber
